spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    username: admin
    password: pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: America/Sao_Paulo

server:
  port: 8081
  servlet:
    context-path: /api/auth

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

jwt:
  secret: TskF10w@JWT$3cr3tK3y!2024#AuthMicroS3rvice
  expirationMs: 86400000  # 24 horas em milissegundos

logging:
  level:
    com.taskflow.auth: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE